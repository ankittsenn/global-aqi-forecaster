name: Refresh world snapshot

on:
  schedule:
    - cron: "30 3 * * *"      # every day, 03:30 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python update_snapshot.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add data/processed/world_snapshot.csv
          git diff --cached --quiet || (git commit -m "Refresh world snapshot" && git push)
